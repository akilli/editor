<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
        <title>akilli editor</title>
        <link rel="stylesheet" href="css/base.css">
        <link id="css" rel="stylesheet">
        <link rel="stylesheet" href="css/app.css">
        <link rel="shortcut icon" href="img/logo.svg" sizes="any">
        <script type="module" src="js/app.js"></script>
    </head>
    <body>
        <header id="header">
            <div>
                <label for="scheme">color-scheme</label>
                <select id="scheme">
                    <option value="" selected>browser</option>
                    <option value="light">light</option>
                    <option value="dark">dark</option>
                </select>
            </div>
            <div>
                <label for="version">version</label>
                <select id="version">
                    <option value="dist" selected>dist</option>
                    <option value="src">src</option>
                </select>
            </div>
            <div>
                <label for="lang">language</label>
                <select id="lang">
                    <option value="en" selected>en</option>
                    <option value="de">de</option>
                </select>
            </div>
        </header>
        <main>
            <div id="rte"></div>
        </main>
        <footer id="footer">
            <button id="clear" type="button">Clear</button>
            <button id="save" type="button">Save</button>
        </footer>
    </body>
</html>
